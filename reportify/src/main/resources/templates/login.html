<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Reportify</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .login-box {
            text-align: center;
        }

        .login-box div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 8px 20px;
            cursor: pointer;
        }

        .message {
            width: 280px;
            margin: 0 auto 18px;
            border-radius: 7px;
            padding: 11px 13px;
        }

        .error {
            border: 1px solid #fca5a5;
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            border: 1px solid #86efac;
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Reportify</h1>
        <h2>Anmelden</h2>

        <div
            class="message error"
            role="alert"
            th:if="${param.error}">
            Benutzername oder Passwort ist nicht korrekt.
        </div>

        <div
            class="message success"
            role="status"
            th:if="${param.logout}">
            Sie wurden erfolgreich abgemeldet.
        </div>

        <form th:action="@{/login}" method="post">

            <div>
                <label for="username">Benutzername</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    autofocus
                    required>
            </div>

            <div>
                <label for="password">Passwort</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit">Anmelden</button>

        </form>

    </div>

</body>
</html>
