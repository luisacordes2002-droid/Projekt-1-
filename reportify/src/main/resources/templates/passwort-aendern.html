<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persönliches Passwort festlegen – Reportify</title>
    <link rel="stylesheet" th:href="@{/css/reportify.css}" href="/css/reportify.css">
</head>
<body>
<main class="auth-page">
    <section class="auth-brand-panel" aria-label="Reportify">
        <a class="brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">R</span><span>Reportify</span></a>
        <div>
            <p class="eyebrow">Erste Anmeldung</p>
            <h1>Schütze dein Benutzerkonto.</h1>
            <p>Ersetze das Startpasswort durch ein persönliches Passwort, bevor du mit Reportify weiterarbeitest.</p>
        </div>
    </section>
    <section class="auth-form-panel">
        <div class="auth-card">
            <p class="eyebrow">Kontosicherheit</p>
            <h2>Passwort festlegen</h2>
            <p class="auth-copy">Verwende ein persönliches Passwort mit 8 bis 128 Zeichen.</p>
            <div class="message message-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">Das Passwort konnte nicht übernommen werden.</div>
            <form th:action="@{/passwort-aendern}" method="post">
                <div class="field">
                    <label for="neuesPasswort">Neues Passwort</label>
                    <div class="password-wrap">
                        <input class="input" id="neuesPasswort" name="neuesPasswort" type="password" minlength="8" maxlength="128" autocomplete="new-password" required autofocus>
                        <button class="password-toggle" type="button" data-password-toggle="neuesPasswort" aria-pressed="false">Anzeigen</button>
                    </div>
                </div>
                <div class="field">
                    <label for="passwortBestaetigung">Passwort bestätigen</label>
                    <div class="password-wrap">
                        <input class="input" id="passwortBestaetigung" name="passwortBestaetigung" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                        <button class="password-toggle" type="button" data-password-toggle="passwortBestaetigung" aria-pressed="false">Anzeigen</button>
                    </div>
                </div>
                <button class="button button-primary" type="submit">Passwort festlegen</button>
            </form>
        </div>
    </section>
</main>
<script th:src="@{/js/reportify.js}" src="/js/reportify.js"></script>
</body>
</html>
