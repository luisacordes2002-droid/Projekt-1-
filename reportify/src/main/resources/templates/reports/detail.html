<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportdetails – Reportify</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f6f9;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        header {
            background: #17324d;
            color: white;
            padding: 18px 24px;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header a {
            border-radius: 7px;
            padding: 10px 14px;
            background: white;
            color: #17324d;
            font-weight: bold;
            text-decoration: none;
        }

        main {
            max-width: 900px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .message {
            margin-bottom: 20px;
            border-radius: 8px;
            padding: 13px 16px;
        }

        .success {
            border: 1px solid #86efac;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            border: 1px solid #fca5a5;
            background: #fee2e2;
            color: #991b1b;
        }

        .report-card {
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            background: white;
            padding: 30px;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.08);
        }

        .title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0;
            font-size: 30px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            border-radius: 999px;
            padding: 6px 11px;
            background: #e2e8f0;
            color: #334155;
            font-size: 13px;
            font-weight: bold;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 28px;
            border-radius: 9px;
            background: #f8fafc;
            padding: 18px;
        }

        .meta-label {
            display: block;
            margin-bottom: 5px;
            color: #64748b;
            font-size: 13px;
            font-weight: bold;
        }

        .content {
            min-height: 180px;
            border-top: 1px solid #e2e8f0;
            padding-top: 24px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 30px;
            border-top: 1px solid #e2e8f0;
            padding-top: 22px;
        }

        .button {
            display: inline-block;
            border: 0;
            border-radius: 8px;
            padding: 12px 18px;
            font: inherit;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .button-secondary {
            border: 1px solid #cbd5e1;
            background: white;
            color: #334155;
        }

        .button-success {
            background: #16a34a;
            color: white;
        }

        .button-danger {
            background: #dc2626;
            color: white;
        }

        .completed {
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
            padding: 12px 16px;
            font-weight: bold;
        }

        form {
            margin: 0;
        }

        @media (max-width: 650px) {
            .header-content,
            .title-row,
            .actions {
                align-items: stretch;
                flex-direction: column;
            }

            .meta {
                grid-template-columns: 1fr;
            }

            .report-card {
                padding: 22px;
            }

            .button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
<header>
    <div class="header-content">
        <h1>Reportify</h1>
        <a th:href="@{/reports}">Zur Reportübersicht</a>
    </div>
</header>

<main>
    <div
        class="message success"
        th:if="${successMessage}"
        th:text="${successMessage}">
    </div>

    <div
        class="message error"
        th:if="${errorMessage}"
        th:text="${errorMessage}">
    </div>

    <article class="report-card">
        <div class="title-row">
            <h2 th:text="${report.title}">Report-Titel</h2>

            <div class="badges">
                <span
                    class="badge"
                    th:text="'Priorität: ' + ${report.priority}">
                    Priorität
                </span>
                <span
                    class="badge"
                    th:text="${'Schicht: ' + (report.shift.name() == 'FRUEHSCHICHT'
                        ? 'Frühschicht'
                        : (report.shift.name() == 'SPAETSCHICHT'
                            ? 'Spätschicht'
                            : 'Nachtschicht'))}">
                    Schicht
                </span>

                <span
                    class="badge"
                    th:text="'Status: ' + ${report.status}">
                    Status
                </span>
            </div>
        </div>

        <section class="meta">
            <div>
                <span class="meta-label">Erstellt von</span>
                <span th:text="${report.createdBy}">Benutzername</span>
            </div>

            <div>
                <span class="meta-label">Erstellt am</span>
                <span th:text="${report.formattedCreatedAt}">Zeitpunkt</span>
            </div>
        </section>

        <section>
            <span class="meta-label">Übergabe und Hinweise</span>

            <div
                class="content"
                th:text="${report.content}">
                Inhalt des Reports
            </div>
        </section>

        <div class="actions">
            <a
                class="button button-secondary"
                th:href="@{/reports}">
                Zurück zur Übersicht
            </a>

            <form
                th:if="${report.status.name() != 'ERLEDIGT'}"
                th:action="@{/reports/{id}/complete(id=${report.id})}"
                method="post">

                <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

                <button class="button button-success" type="submit">
                    Als erledigt markieren
                </button>
            </form>

            <form
                th:if="${canDelete}"
                th:action="@{/reports/{id}/delete(id=${report.id})}"
                method="post"
                onsubmit="return confirm('Soll dieser Report wirklich gelöscht werden?');">

                <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

                <button class="button button-danger" type="submit">
                    Report löschen
                </button>
            </form>

            <div
                class="completed"
                th:if="${report.status.name() == 'ERLEDIGT'}">
                Dieser Report ist erledigt.
            </div>
        </div>
    </article>
</main>
</body>
</html>
