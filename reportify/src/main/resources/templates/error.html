<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fehler – Reportify</title>
    <link rel="stylesheet" th:href="@{/css/reportify.css}" href="/css/reportify.css">
</head>
<body>
<main class="error-page">
    <section class="error-card">
        <a class="brand" th:href="@{/reports}"><span class="brand-mark" aria-hidden="true">R</span><span>Reportify</span></a>
        <div class="error-code" th:text="${status != null ? status : 'Fehler'}">Fehler</div>
        <h1 th:if="${status == 404}">Seite nicht gefunden</h1>
        <h1 th:unless="${status == 404}">Ein Fehler ist aufgetreten</h1>
        <p th:if="${status == 404}">Die angeforderte Seite ist nicht vorhanden oder wurde verschoben.</p>
        <p th:unless="${status == 404}">Die Anfrage konnte nicht verarbeitet werden. Versuche es bitte erneut oder kehre zur Reportübersicht zurück.</p>
        <a class="button button-primary" th:href="@{/reports}">Zur Reportübersicht</a>
    </section>
</main>
</body>
</html>
